set default=0
set timeout=5

# Stylistyka dekodera TV (ciemny motyw / minimalistyczny)
set menu_color_normal=light-gray/black
set menu_color_highlight=yellow/dark-gray

# Wczytanie niezbędnych modułów partycji i systemów plików
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ext2
insmod search
insmod search_fs_file
insmod search_label
insmod efi_gop
insmod efi_uga
insmod font

# Dynamiczne odnalezienie partycji z jądrem i nośnikiem Live
if [ -z "$root" -o ! -f "($root)/live/vmlinuz" ]; then
    if search --no-floppy --set=root --file /live/vmlinuz ; then
        set root=$root
    elif search --no-floppy --set=root --label TVDECODER_OS ; then
        set root=$root
    fi
fi

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

menuentry "📺 Uruchom TVDecoder OS (Tryb Live USB)" --class gnu-linux --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer rd.systemd.show_status=false rd.udev.log_level=0 udev.log_priority=0 username=tvuser live-config.username=tvuser
    initrd /live/initrd.img
}

menuentry "💾 Zainstaluj TVDecoder OS na dysku (Dedykowany Set-Top Box)" --class gnu-linux --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components install_mode=1 quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer username=tvuser live-config.username=tvuser
    initrd /live/initrd.img
}

menuentry "🌐 TVDecoder OS - Konfiguracja Wi-Fi / Tryb ratunkowy" --class gnu-linux --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components single systemd.unit=multi-user.target
    initrd /live/initrd.img
}

menuentry "🔄 Restart komputera" {
    reboot
}

menuentry "⏻ Wyłącz komputer" {
    halt
}
