UI vesamenu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE ================= Aurora OS =================
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std

LABEL wayland
    MENU LABEL ^1. Uruchom Aurora OS (Wayland Kiosk Shell - Opcja B)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash ui_mode=wayland loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer rd.systemd.show_status=false rd.udev.log_level=0 udev.log_priority=0 username=tvuser live-config.username=tvuser

LABEL wpe
    MENU LABEL ^2. Uruchom Aurora OS (WPE Direct DRM STB - Opcja C)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash ui_mode=wpe loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer rd.systemd.show_status=false rd.udev.log_level=0 udev.log_priority=0 username=tvuser live-config.username=tvuser

LABEL x11
    MENU LABEL ^3. Uruchom Aurora OS (Tryb X11 / Kompatybilny)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash ui_mode=x11 loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer rd.systemd.show_status=false rd.udev.log_level=0 udev.log_priority=0 username=tvuser live-config.username=tvuser

LABEL install
    MENU LABEL ^4. Zainstaluj Aurora OS na dysk
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components install_mode=1 quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer username=tvuser live-config.username=tvuser

LABEL rescue
    MENU LABEL ^3. Tryb awaryjny / Konfiguracja Wi-Fi
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components single systemd.unit=multi-user.target
