UI vesamenu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE ================= TVDecoder OS =================
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std

LABEL live
    MENU LABEL ^1. Uruchom TVDecoder OS (Tryb Live USB)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer rd.systemd.show_status=false rd.udev.log_level=0 udev.log_priority=0 console=tty3

LABEL install
    MENU LABEL ^2. Zainstaluj TVDecoder OS na dysk
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components install_mode=1 quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 fbcon=nodefer console=tty3

LABEL rescue
    MENU LABEL ^3. Tryb awaryjny / Konfiguracja Wi-Fi
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components single systemd.unit=multi-user.target
