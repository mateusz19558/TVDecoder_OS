name: Build Aurora OS (TVDecoder) ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Uruchomienie skryptu budowania ISO
        run: |
          chmod +x scripts/build_iso.sh
          sudo GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash ./scripts/build_iso.sh

      - name: Publikacja pliku ISO jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-Hybrid-ISO
          path: |
            TVDecoderOS.iso
            AuroraOS.iso
          if-no-files-found: warn
          retention-days: 14
